name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10.9 (bundled with Node 22) can crash resolving vitest's peer set; npm 11 does not.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The published shape: pack, install the tarball in an empty dir, and list the tools.
      - name: smoke-test the packed tarball
        run: |
          npm pack
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/musterd-whiteboard-*.tgz
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5; } | npx whiteboard > out.jsonl
          grep -q whiteboard_open out.jsonl
